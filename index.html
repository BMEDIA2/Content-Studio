<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Content Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f7;--panel:#fff;--side:#fafafc;--sideHover:#eeeef3;--sideActive:#fff;--sideText:#5d5f6b;--text:#15161c;--muted:#7b7d89;--line:#e7e7ee;--line2:#f1f1f5;--hover:#f5f5f8;--accent:#6c5ce7;--accent2:#b14bf4;--accentSoft:#f0eefe;--grad:linear-gradient(135deg,var(--accent),var(--accent2));--sh1:0 1px 2px rgba(20,20,40,.04);--shadow:0 1px 2px rgba(20,20,40,.04),0 6px 20px -6px rgba(20,20,40,.08);--shLg:0 24px 64px -12px rgba(20,20,40,.28);--r:14px;--glass:rgba(255,255,255,.78)}
[data-theme="dark"]{--bg:#0d0e12;--panel:#16171d;--side:#111217;--sideHover:#1c1d24;--sideActive:#22232b;--sideText:#a2a4af;--text:#ececf1;--muted:#8a8c98;--line:#25262e;--line2:#1d1e25;--hover:#1e1f26;--accentSoft:#262246;--sh1:0 1px 2px rgba(0,0,0,.3);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -8px rgba(0,0,0,.45);--shLg:0 24px 64px -12px rgba(0,0,0,.7);--glass:rgba(22,23,29,.78)}
[data-theme="brand"]{--bg:#0B1F1C;--panel:#0F2E29;--side:#071614;--sideHover:#12362F;--sideActive:#16413A;--sideText:#93A9A0;--text:#ECEFE9;--muted:#93A9A0;--line:#1B453D;--line2:#143A33;--hover:#12362F;--accent:#D6A431;--accent2:#9FB8A0;--accentSoft:rgba(214,164,49,.15);--grad:linear-gradient(135deg,#D6A431,#C2902A);--sh1:0 1px 2px rgba(0,0,0,.35);--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -8px rgba(0,0,0,.5);--shLg:0 24px 64px -12px rgba(0,0,0,.75);--glass:rgba(15,46,41,.82);--ink:#12211E}
[data-theme="brand"] h1,[data-theme="brand"] h2,[data-theme="brand"] h3,[data-theme="brand"] h4,[data-theme="brand"] .brand,[data-theme="brand"] .kpi .v,[data-theme="brand"] .ttitle,[data-theme="brand"] .ptitle,[data-theme="brand"] .pn{font-family:Fraunces,Georgia,serif;letter-spacing:-.2px}
[data-theme="brand"] .btn.pri,[data-theme="brand"] .brand .logo,[data-theme="brand"] .day.today .dn span,[data-theme="brand"] .drop .big{color:var(--ink)}
[data-theme="brand"] .brand{color:#9FB8A0}
[data-theme="brand"] main{background:radial-gradient(900px 340px at 85% -120px,rgba(159,184,160,.10),transparent 70%)}
[data-theme="brand"] .tab.on{background:var(--sideActive)}
[data-theme="brand"] .tab.on svg,[data-theme="brand"] .sitem.cta{color:var(--accent)}
[data-theme="brand"] .late{color:#E0675B!important}
[data-theme="brand"] .btn.danger{color:#E0675B}
[data-theme="brand"] .toast{background:#071614;border:1px solid var(--line)}
[data-theme="brand"] .hero{background:linear-gradient(135deg,rgba(159,184,160,.14),rgba(214,164,49,.08)),var(--panel)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;margin:4px 0 6px;border-radius:10px;background:color-mix(in srgb,var(--line) 70%,transparent)}
.themes button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;font-size:11px;font-weight:600;color:var(--sideText)}
.themes button:hover{color:var(--text)}
.themes button.on{background:var(--sideActive);color:var(--text);box-shadow:var(--sh1)}
.themes .sw3{width:22px;height:14px;border-radius:5px;border:1px solid rgba(128,128,128,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3,h4,.brand,.kpi .v,.ttitle,.ptitle,.pn{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--text)}
select option{background:var(--panel)}
a{color:var(--accent)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 35%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
#app{display:flex;height:100vh;overflow:hidden}
.side{width:256px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto;gap:1px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:800;font-size:16.5px;letter-spacing:-.3px}
.brand .logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.brand small{display:block;font:500 11px Inter,sans-serif;color:var(--muted);letter-spacing:0}
.sclose{margin-left:auto;width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s}.sclose:hover{background:var(--hover,color-mix(in srgb,var(--muted) 14%,transparent));color:var(--ink)}
@media (min-width:861px){.side.hid{display:none}.burger.show{display:grid}}
.slabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:16px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.slabel button{color:var(--muted);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.slabel button:hover{background:var(--sideHover);color:var(--text)}
.sitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 9px;border-radius:9px;color:var(--sideText);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s,color .12s}
.sitem:hover{background:var(--sideHover);color:var(--text)}
.sitem.on{background:var(--sideActive);color:var(--text);font-weight:600;box-shadow:var(--sh1),inset 0 0 0 1px var(--line)}
.sitem .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:13px;background:var(--line2)}
.sitem.on .ic{background:var(--accentSoft);color:var(--accent)}
.sitem .tx{overflow:hidden;text-overflow:ellipsis}
.sfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:1px}
.sfoot .sitem .ic{background:none}
.sitem.cta{color:var(--accent);font-weight:600}
.sitem.cta .ic{background:var(--accentSoft)}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(900px 340px at 85% -120px,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%)}
.top{display:flex;align-items:center;gap:12px;padding:18px 32px 12px}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.5px}
.top .crumb{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.top .grow{flex:1}
.burger{display:none;width:36px;height:36px;border-radius:10px;place-items:center;border:1px solid var(--line);background:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;box-shadow:var(--sh1);transition:background .12s,transform .12s,box-shadow .12s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.icon{padding:7px}
.btn.danger{color:#e5484d}
.btn:disabled{opacity:.35;cursor:default}
.tabs{display:flex;padding:0 32px 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--line) 70%,transparent)}
.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:var(--panel);box-shadow:var(--sh1),0 2px 8px -2px rgba(0,0,0,.08)}
.tab.on svg{color:var(--accent)}
.view{flex:1;overflow:auto;padding:24px 32px 70px}
.view.anim>*{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search .inp{padding-left:34px}
.inp{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none;min-width:0;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accentSoft)}
select.inp{padding:7px 10px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:99px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c) 12%,transparent);color:color-mix(in srgb,var(--c) 82%,#000);white-space:nowrap;line-height:18px}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
[data-theme="dark"] .pill,[data-theme="brand"] .pill{background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 55%,#fff)}
.pill .x{cursor:pointer;opacity:.55;font-size:14px;line-height:1;margin-left:2px}
.pill .x:hover{opacity:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.board{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:24px}
.col{width:290px;flex:none;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--line) 32%,transparent);transition:background .15s}
.col.over{background:var(--accentSoft);outline:2px dashed var(--accent);outline-offset:-2px}
.colh{display:flex;align-items:center;gap:8px;padding:6px 6px 4px;font-weight:700;font-size:13px}
.colh .n{color:var(--muted);font-weight:600;font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 7px;line-height:18px}
.colh .grow{flex:1}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;box-shadow:var(--sh1);position:relative;transition:transform .12s,box-shadow .12s,border-color .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tcard.dragging{opacity:.4}
.tcard.drop-before::before,.col.drop-end .addcard::before{content:'';position:absolute;left:4px;right:4px;top:-6px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.addcard{position:relative}
.tcard .pbar{position:absolute;left:13px;top:12px;width:22px;height:4px;border-radius:99px;background:var(--c)}
.tcard.tint{background:color-mix(in srgb,var(--c) 9%,var(--panel));border-color:color-mix(in srgb,var(--c) 30%,var(--line));border-left:4px solid var(--c);padding-left:12px}
.tcard.tint .pbar{display:none}
.tcard.tint .tt{margin-top:0}
.tcard.tint .meta{border-top-color:color-mix(in srgb,var(--c) 18%,var(--line))}
.lt td.title .cbar{display:inline-block;width:4px;height:18px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:10px}
.tcard .tt{font-weight:600;font-size:13.5px;line-height:1.4;margin:10px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.tcard .meta{display:flex;gap:12px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);color:var(--muted);font-size:12px;align-items:center;flex-wrap:wrap}
.tcard .meta span{display:inline-flex;align-items:center;gap:4px}
.tcard .meta svg.i{width:13px;height:13px}
.addcard{color:var(--muted);text-align:left;padding:8px 9px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.addcard:hover{background:var(--panel);color:var(--text)}
.addcol{width:230px;flex:none;border:1.5px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.addcol:hover{color:var(--accent);border-color:var(--accent);background:var(--accentSoft)}
.late{color:#e5484d!important;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
table.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
.lt th:hover{color:var(--text)}
.lt td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.lt tbody tr{cursor:pointer;transition:background .1s}
.lt tbody tr:not(.quick):hover td{background:var(--hover)}
.lt td.title{font-weight:600;white-space:normal;min-width:260px}
.lt .chips{flex-wrap:nowrap}
.quick td{padding:4px 10px;border-bottom:none}
.quick input{width:100%;border:none;background:none;outline:none;padding:9px 6px;color:var(--muted)}
.quick input:focus{color:var(--text)}
.ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);font-size:10px;vertical-align:middle;margin-right:10px;color:#fff}
.ck.on{background:#10b981;border-color:#10b981}
.calwrap{display:flex;gap:16px;align-items:flex-start}
.cal{flex:1;min-width:0}
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.calhead h2{margin:0 12px 0 0;font-size:20px;letter-spacing:-.3px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px;box-shadow:var(--shadow)}
.dow{background:var(--panel);padding:10px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.day{background:var(--panel);min-height:118px;padding:7px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .12s}
.day.out{background:color-mix(in srgb,var(--bg) 55%,var(--panel))}
.day.out .dn span{opacity:.4}
.day.over{background:var(--accentSoft)}
.dn{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dn span{min-width:24px;height:24px;display:inline-grid;place-items:center;border-radius:99px}
.day.today .dn span{background:var(--grad);color:#fff}
.day .plus{opacity:0;color:var(--muted);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.day .plus:hover{background:var(--hover);color:var(--text)}
.day:hover .plus{opacity:1}
.cchip{font-size:11.5px;font-weight:600;padding:4px 7px;border-radius:7px;background:color-mix(in srgb,var(--c) 13%,var(--panel));color:color-mix(in srgb,var(--c) 70%,var(--text));cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:filter .1s}
.cchip:hover{filter:brightness(.96)}
.cchip.done{opacity:.5;text-decoration:line-through}
.nodate{width:250px;flex:none;padding:14px}
.nodate.over{outline:2px dashed var(--accent)}
.nodate h4{margin:0 0 12px;font-size:13.5px}
.nodate .cchip{margin-bottom:6px;padding:7px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.kpi .ki{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 13%,transparent);color:var(--c,var(--accent))}
.kpi .ki svg.i{width:18px;height:18px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.8px;margin-top:2px;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.panel{padding:18px 20px}
.panel h3{margin:0 0 16px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:-.2px}
.brow{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
.brow .lab{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;font-weight:500}
.track{height:8px;background:var(--line2);border-radius:99px;position:relative}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));max-width:100%;transition:width .4s}
.goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.45;border-radius:2px}
.brow .num{text-align:right;font-weight:700;color:var(--muted);font-size:12.5px}
.mini{display:flex;align-items:center;gap:10px;padding:9px 6px;margin:0 -6px;border-radius:9px;cursor:pointer;font-size:13px}
.mini:hover{background:var(--hover)}
.mini .t{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{display:flex;gap:18px;align-items:center;margin-bottom:24px;padding:22px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),color-mix(in srgb,var(--accent2) 8%,var(--panel)));border:1px solid var(--line)}
.hero .emo{font-size:36px;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;flex:none;transition:transform .15s}
.hero .emo:hover{transform:rotate(-4deg) scale(1.04)}
.hero input.pn{font-size:28px;font-weight:800;letter-spacing:-.7px;border:none;background:none;outline:none;width:100%;padding:2px 0}
.hero textarea{width:100%;border:none;background:none;outline:none;resize:none;color:var(--muted);font-size:14px;line-height:1.55;padding:0}
.sec{margin-bottom:28px}
.sech{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sech h3{margin:0;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pagec{padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:140px;transition:transform .15s,box-shadow .15s,border-color .15s}
.pagec:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(20,20,40,.18);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.pagec .pi{font-size:22px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--line2);margin-bottom:4px}
.pagec .pt{font-weight:700;font-size:14.5px}

.fmtbar .fb-sep{width:1px;background:var(--line);margin:4px 4px;flex:none}
.sz-s{font-size:.82em}.sz-n{font-size:15.5px}.sz-l{font-size:1.3em}.sz-xl{font-size:1.75em;line-height:1.3}
.pgpop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shLg);padding:6px;width:300px;max-width:calc(100vw - 20px);max-height:min(70vh,520px);overflow-y:auto;animation:popIn .16s ease}

.editor .blk{position:relative;margin:22px 0;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--sh1);line-height:1.55;user-select:none;-webkit-user-select:none}
.editor .blk .ed{outline:none;user-select:text;-webkit-user-select:text;cursor:text;border-radius:6px;min-width:1ch}
.editor .blk .ed:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.editor .blk .ed:empty:before{content:'…';color:var(--muted)}
.editor .blk ul{margin:4px 0;padding-left:18px}.editor .blk li{margin:2px 0}
.blk-bar{position:absolute;top:-15px;right:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--sh1);opacity:0;transition:opacity .15s;z-index:3}
.blk:hover>.blk-bar,.blk:focus-within>.blk-bar{opacity:1}
@media (hover:none){.blk-bar{opacity:1}}
.blk-bar button{font-size:12px;font-weight:600;padding:4px 8px;border-radius:7px;color:var(--muted);white-space:nowrap}
.blk-bar button:hover{background:var(--hover);color:var(--text)}
.blk-bar .danger:hover{color:#e5484d}
.blk-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .12s;z-index:2}
.blk-x:hover{background:var(--hover);color:#e5484d}

/* mapa mental */
.blk-map{padding:22px 18px 20px}
.mm-lines{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mm-lines path{fill:none;stroke-width:2;stroke-linecap:round;opacity:.55}
.mm-c{position:relative;z-index:1;display:flex;justify-content:center;margin-bottom:34px}
.mm-ct{background:var(--grad);color:#fff;font-weight:800;font-size:17px;padding:12px 22px;border-radius:999px;text-align:center;box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 70%,transparent);max-width:100%}

.mm-bs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}

/* rueda */
.wh{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}

.wh-chip.on{border-color:var(--text)}
.wh-i{display:none;position:relative;border:1px solid var(--line);border-left:4px solid var(--bc);border-radius:12px;padding:14px 16px}

.wh-d{font-size:14.5px}

/* flujo */
.fl{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px 30px}

.fl-s:not(:last-child):after{content:'→';position:absolute;right:-24px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:18px}
.fl.loop .fl-s:last-child:after{content:'↺';position:absolute;right:-24px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:800;font-size:19px}
.fl-n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--bc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.fl-t{font-weight:600;font-size:14.5px;flex:1}

.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.cd-g{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bc);padding-right:18px}
.cd-t{font-weight:800;font-size:16px;margin:2px 0 4px}
.cd-d{font-size:14px;color:var(--muted)}

.acc-i{border-bottom:1px solid var(--line)}.acc-i:last-child{border-bottom:0}

.acc-tg{width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:var(--bc);font-size:13px;transition:transform .18s,background .12s}
.acc-tg:hover{background:var(--hover)}
.acc-i.open .acc-tg{transform:rotate(90deg)}
.acc-t{font-weight:700;flex:1}
.acc-b{display:none;padding:0 0 14px 32px;font-size:14.5px}
.acc-i.open .acc-b{display:block}
/* nota */
.editor .blk-note{background:color-mix(in srgb,var(--bc) 10%,var(--panel));border-color:color-mix(in srgb,var(--bc) 30%,var(--line));border-left:4px solid var(--bc)}
.nt{display:flex;gap:12px;align-items:flex-start}
.nt-e{font-size:22px;line-height:1.2;flex:none}
.nt-t{flex:1;font-size:15px}
/* cifras */
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.st-i{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--bc) 7%,var(--panel))}
.st-v{font-weight:800;font-size:26px;letter-spacing:-.5px;color:var(--bc);font-variant-numeric:tabular-nums;padding-right:16px}
.st-l{font-size:13px;color:var(--muted)}
/* tabla */
.tbw{overflow-x:auto}
.tb{border-collapse:collapse;width:100%;min-width:360px;font-size:14px}
.tb th,.tb td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;min-width:60px}
.tb th{background:var(--hover);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
/* checklist */
.ck-i{position:relative;display:flex;align-items:flex-start;gap:10px;padding:7px 24px 7px 2px;border-bottom:1px solid var(--line2)}
.ck-i:last-child{border-bottom:0}
.ck-i input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--accent);cursor:pointer}
.ck-i.done .ck-t{text-decoration:line-through;color:var(--muted)}
.ck-t{flex:1}
@media (max-width:760px){.editor .blk{padding:16px 12px;margin:24px 0}.blk-bar{right:6px;max-width:calc(100% - 12px);overflow-x:auto}.fl{gap:26px}.fl-s{max-width:none;flex-basis:100%}.fl-s:not(:last-child):after,.fl.loop .fl-s:last-child:after{right:auto;left:22px;top:auto;bottom:-25px;transform:rotate(90deg)}}
@media print{.blk-bar,.blk-x,.fmtbar{display:none!important}.wh-i{display:block}.acc-b{display:block}}
.blk-grip{cursor:grab;touch-action:none}
.blk.dragging{opacity:.35}
.blk.moved{animation:blkMoved .7s ease}
@keyframes blkMoved{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:var(--sh1)}}
#dgline{position:fixed;height:4px;border-radius:4px;background:var(--accent);z-index:90;pointer-events:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.dg-ghost{position:fixed;z-index:91;pointer-events:none;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));display:grid;place-items:center;font-weight:700;color:var(--accent);opacity:.9;box-shadow:var(--shLg)}
body.dg-on,body.dg-on *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function O(label,color,extra){return Object.assign({id:uid(),label,color},extra||{})}
function newProject(name,sample){

function vDash(){const p=P();const ts=p.tasks;const t0=todayS();const wk=addD(7);

function vPillars(){const p=P();const tot=p.tasks.length||1;

function renderApp(){
  if(!S){if(U.auth&&U.auth.mode!=='app')drawAuth();return}
  try{localStorage.setItem(KEY+'-theme',S.theme||'light')}catch(e){}
  document.documentElement.dataset.theme=['dark','brand'].includes(S.theme)?S.theme:'light';
  const app=$('#app');const a=document.activeElement;const id=a&&a.id&&app.contains(a)?a.id:null;let s1=null,s2=null;try{s1=a.selectionStart;s2=a.selectionEnd}catch(e){}

  const m=isM();const V={overview:vOverview,board:vBoard,list:m?vListM:vList,calendar:m?vCalM:vCal,dashboard:vDash,pillars:vPillars,page:vPage}[S.view]||vOverview;
  const body=V();

  <nav class="bnav">${bn.map(([v,l,i])=>`<button class="${S.view===v?'on':''}" data-a="nav" data-v="${v}">${ic(i)}${l}</button>`).join('')}<button class="${['dashboard','pillars','page'].includes(S.view)||U.side?'on':''}" data-a="burger">${ic('more')}Más</button></nav>
  ${S.view==='page'?'':`<button class="fab" data-a="newTask" title="Nuevo contenido">${ic('plus')}</button>`}`;
  const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content={dark:'#0d0e12',brand:'#0B1F1C'}[S.theme]||'#f4f4f7';
  const bdn=$('.board');if(bdn&&m){bdn.onscroll=()=>{const cs=bdn.querySelectorAll('.col');let i=0,best=1e9;cs.forEach((c,j)=>{const d=Math.abs(c.offsetLeft-bdn.scrollLeft-14);if(d<best){best=d;i=j}});if(i!==U.colI){U.colI=i;document.querySelectorAll('.colnav button').forEach((b,j)=>b.classList.toggle('on',j===i))}}}
  U.lastView=S.view+(S.view==='page'?S.pageId:'');navKeep();

const SKEY=KEY+'-setup';
const SB_URL_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
const SB_SQL=`create table if not exists public.content_studio (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.content_studio enable row level security;
create policy "leer lo mio" on public.content_studio for select using (auth.uid() = user_id);
create policy "crear lo mio" on public.content_studio for insert with check (auth.uid() = user_id);
create policy "editar lo mio" on public.content_studio for update using (auth.uid() = user_id);`;
const SB={cfg:null,client:null,user:null,timer:null,st:'off',msg:'',last:0,pushing:null};
let DKEY=null;
const validCfg=c=>!!(c&&/^https:\/\/.+\.supabase\.co\/?$/i.test(c.url||'')&&String(c.key||'').length>=30);
function sbCfg(){const g=window.CS_CONFIG;if(validCfg(g))return {url:g.url.replace(/\/$/,''),key:g.key,fixed:true};try{const c=JSON.parse(localStorage.getItem(SKEY));return validCfg(c)?c:null}catch(e){return null}}
function sbSaveCfg(c){try{c?localStorage.setItem(SKEY,JSON.stringify(c)):localStorage.removeItem(SKEY)}catch(e){}}
const SYNC_UI={off:['#94a3b8','Sin conexión a la nube'],ok:['#10b981','Guardado en la nube'],busy:['#f59e0b','Guardando…'],err:['#ef4444','Error al guardar'],offline:['#94a3b8','Sin conexión']};
function syncPill(){const [c,l]=SYNC_UI[SB.st]||SYNC_UI.off;return `<button class="sync ${SB.st==='busy'?'busy':''}" data-a="pushM" data-m="sync" title="${esc(SB.msg||l)}"><span class="sd" style="--sc:${c}"></span><span class="sl">${l}</span></button>`}
function setSync(st,msg){SB.st=st;SB.msg=msg||'';if(st==='ok')SB.last=Date.now();const [c,l]=SYNC_UI[st]||SYNC_UI.off;
  document.querySelectorAll('.sync').forEach(b=>{b.classList.toggle('busy',st==='busy');b.title=msg||l;const d=b.querySelector('.sd');if(d)d.style.setProperty('--sc',c);const t=b.querySelector('.sl');if(t)t.textContent=l})}
function loadSBLib(){return new Promise((res,rej)=>{if(window.supabase&&window.supabase.createClient)return res();const s=document.createElement('script');s.src=SB_URL_JS;s.onload=()=>res();s.onerror=()=>rej(new Error('No se pudo conectar. Revisa tu conexión a internet.'));document.head.appendChild(s)})}
async function sbClient(cfg){if(SB.client)return SB.client;await loadSBLib();
  SB.client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:KEY+'-auth'}});SB.cfg=cfg;return SB.client}
async function sbFetch(){const {data,error}=await SB.client.from('content_studio').select('data,updated_at').eq('user_id',SB.user.id).maybeSingle();if(error)throw error;return data}
async function sbPush(){if(!SB.client||!SB.user||!S)return;clearTimeout(SB.timer);SB.timer=null;
  if(!navigator.onLine){setSync('offline','Se guardará en la nube cuando vuelvas a tener conexión');return}
  setSync('busy');const snap=JSON.parse(JSON.stringify(S));const uid=SB.user.id;
  const run=SB.client.from('content_studio').upsert({user_id:uid,data:snap,updated_at:new Date().toISOString()});
  SB.pushing=run;const {error}=await run;SB.pushing=null;if(error){setSync('err',error.message);throw error}setSync('ok')}
function saveLocal(){if(!DKEY||!S)return;try{localStorage.setItem(DKEY,JSON.stringify(S))}catch(e){}}
const NAV=['view','pageId','cur','cal'];
function navSnap(){const o={};if(S)NAV.forEach(k=>{if(S[k]!==undefined)o[k]=JSON.parse(JSON.stringify(S[k]))});return o}
function navKeep(){try{sessionStorage.setItem(KEY+'-nav',JSON.stringify(navSnap()))}catch(e){}}
function navRestore(){try{const o=JSON.parse(sessionStorage.getItem(KEY+'-nav')||'null');if(o&&S)Object.assign(S,o)}catch(e){}}
function navSave(){saveLocal();navKeep()}
function applyRemote(r){const n=navSnap();S=r;Object.assign(S,n);norm();saveLocal();U.ms=U.ms.filter(m=>m.m!=='task'||task(m.id));renderApp();renderModal()}
async function sbPull(){if(!SB.client||!SB.user)return;if(!navigator.onLine){setSync('offline');return}
  if(SB.pushing)await SB.pushing;setSync('busy','Sincronizando…');const d=await sbFetch();
  if(!d){await sbPush();return}const rr=+((d.data||{}).rev)||0,lr=+(S&&S.rev)||0;
  if(rr>lr){applyRemote(d.data);setSync('ok')}else if(lr>rr)await sbPush();else setSync('ok')}
function schedulePush(){if(!SB.user)return;setSync('busy');clearTimeout(SB.timer);SB.timer=setTimeout(()=>sbPush().catch(()=>{}),1200)}
const userName=u=>{const m=(u&&u.user_metadata)||{};return (m.name||m.full_name||String(u&&u.email||'').split('@')[0]||'Tú').trim()};

function themeBoot(){let t='light';try{t=localStorage.getItem(KEY+'-theme')||'light'}catch(e){}document.documentElement.dataset.theme=['dark','brand'].includes(t)?t:'light'}
function renderAuth(mode,msg){U.auth=Object.assign(U.auth||{},{mode,msg:msg||null,busy:false});themeBoot();$('#modal-root').innerHTML='';drawAuth()}
function drawAuth(){const A=U.auth||{mode:'login'};const f=A.form||{};const m=A.mode;
  const msg=A.msg?`<div class="msg-${A.msg[0]}">${esc(A.msg[1])}</div>`:'';
  const inp=(id,label,type,ph,ac,val)=>`<div class="field"><label for="${id}">${label}</label><input class="inp" id="${id}" type="${type}" placeholder="${ph||''}" autocomplete="${ac||'off'}" autocapitalize="off" data-k="authEnter" value="${esc(val||'')}"></div>`;
  let body='';
  if(m==='loading')body=`<div class="auth-load"><span class="spin"></span>Cargando tu espacio…</div>`;
  else if(m==='setup')body=`<h2>Conectar la app</h2><p class="note">Aún no está configurada la base de datos. Edita el archivo <b>config.js</b> con la URL y la clave publishable de tu proyecto de Supabase, o pégalas aquí para usarla en este navegador.</p>${msg}
    ${inp('stUrl','URL del proyecto','url','https://xxxx.supabase.co','off',f.url)}${inp('stKey','Clave publishable','text','sb_publishable_...','off',f.key)}
    <button class="btn pri wide" data-a="authSetup">Conectar</button>
    <details class="sqlbox"><summary>Código SQL para crear la tabla (solo una vez)</summary><div class="sql">${esc(SB_SQL)}</div><button class="btn sm" data-a="sbCopySql">Copiar SQL</button></details>`;
  else if(m==='signup')body=`<h2>Crea tu cuenta</h2><p class="note">Tu contenido es privado: solo tú puedes verlo.</p>${msg}
    ${inp('auName','Nombre','text','Cómo quieres que te llamemos','name',f.name)}${inp('auEmail','Email','email','tu@email.com','email',f.email)}${inp('auPass','Contraseña','password','Mínimo 8 caracteres','new-password')}
    <button class="btn pri wide" data-a="authSignup" ${A.busy?'disabled':''}>${A.busy?'Creando cuenta…':'Crear cuenta'}</button>
    <p class="alt">¿Ya tienes cuenta? <a href="#" data-a="authTab" data-m="login">Inicia sesión</a></p>`;
  else if(m==='forgot')body=`<h2>Recuperar contraseña</h2><p class="note">Te enviaremos un enlace a tu email para crear una contraseña nueva.</p>${msg}
    ${inp('auEmail','Email','email','tu@email.com','email',f.email)}
    <button class="btn pri wide" data-a="authForgot" ${A.busy?'disabled':''}>${A.busy?'Enviando…':'Enviar enlace'}</button>
    <p class="alt"><a href="#" data-a="authTab" data-m="login">Volver a iniciar sesión</a></p>`;
  else if(m==='newpass')body=`<h2>Nueva contraseña</h2>${msg}${inp('auPass','Contraseña nueva','password','Mínimo 8 caracteres','new-password')}${inp('auPass2','Repite la contraseña','password','','new-password')}
    <button class="btn pri wide" data-a="authNewPass" ${A.busy?'disabled':''}>${A.busy?'Guardando…':'Guardar y entrar'}</button>`;
  else if(m==='check')body=`<h2>Revisa tu email</h2>${msg}<p class="note">Abre el enlace que te enviamos para confirmar tu cuenta. Después vuelve aquí e inicia sesión.</p><button class="btn pri wide" data-a="authTab" data-m="login">Ir a iniciar sesión</button>`;
  else body=`<h2>Inicia sesión</h2><p class="note">Accede a tu espacio de contenido.</p>${msg}
    ${inp('auEmail','Email','email','tu@email.com','email',f.email)}${inp('auPass','Contraseña','password','','current-password')}
    <div style="text-align:right;margin:-6px 0 14px"><a href="#" class="small" data-a="authTab" data-m="forgot">¿Olvidaste tu contraseña?</a></div>
    <button class="btn pri wide" data-a="authLogin" ${A.busy?'disabled':''}>${A.busy?'Entrando…':'Entrar'}</button>
    <p class="alt">¿No tienes cuenta? <a href="#" data-a="authTab" data-m="signup">Crea una gratis</a></p>`;
  $('#app').innerHTML=`<div class="auth"><div class="auth-card"><div class="brand auth-brand"><div class="logo">${ic('sparkle',17)}</div><div>Content Studio<small>Instagram · YouTube · Stories</small></div></div>${body}</div>
   <p class="auth-foot">${ic('check',13)} Cada cuenta tiene sus datos privados, protegidos en la nube.</p></div>`;
  const first=$('#app .auth-card input');if(first&&!/Mobi/.test(navigator.userAgent))first.focus()}
function authErr(e){const m=String((e&&e.message)||e);
  if(/Invalid login/i.test(m))return 'Email o contraseña incorrectos.';
  if(/Email not confirmed/i.test(m))return 'Aún no has confirmado tu email. Revisa tu bandeja de entrada (y spam).';
  if(/already registered|already been registered|exists/i.test(m))return 'Ya existe una cuenta con ese email. Inicia sesión.';
  if(/Password should be|weak|at least/i.test(m))return 'La contraseña es muy débil. Usa al menos 8 caracteres.';
  if(/rate limit|too many/i.test(m))return 'Demasiados intentos. Espera un momento y vuelve a probar.';
  if(/relation|does not exist|schema cache/i.test(m))return 'Falta crear la tabla en Supabase (SQL Editor).';
  if(/Failed to fetch|NetworkError|conexión/i.test(m))return 'No hay conexión. Revisa tu internet.';
  return m}
const val=id=>{const n=document.getElementById(id);return n?n.value.trim():''};
async function authRun(fn){const A=U.auth;const pw={pass:val('auPass'),pass2:val('auPass2')};A.form={name:val('auName')||(A.form||{}).name,email:val('auEmail')||(A.form||{}).email,url:val('stUrl'),key:val('stKey')};A.msg=null;A.busy=true;drawAuth();
  try{await fn(pw)}catch(e){A.busy=false;A.msg=['err',authErr(e)];if(U.auth.mode!=='app')drawAuth()}}
async function enterApp(user){SB.user=user;DKEY=KEY+':'+user.id;U.auth={mode:'app'};
  let local=null;try{local=JSON.parse(localStorage.getItem(DKEY))}catch(e){}
  if(local&&Array.isArray(local.projects)){S=local;navRestore();norm();S.userName=userName(user);renderApp()}
  else{S=null;renderAuth('loading')}
  try{const d=await sbFetch();
    if(d&&d.data&&Array.isArray(d.data.projects)){if(!S||(+d.data.rev||0)>(+S.rev||0)){const n=S?navSnap():null;S=d.data;if(n)Object.assign(S,n);else navRestore();norm()}}
    else if(!S){let legacy=null;try{legacy=JSON.parse(localStorage.getItem(KEY))}catch(e){}
      if(legacy&&Array.isArray(legacy.projects)&&legacy.projects.length&&confirm('Encontramos contenido guardado en este navegador de antes de usar cuentas.\n\n¿Quieres pasarlo a tu cuenta?')){S=legacy;norm();try{localStorage.removeItem(KEY)}catch(e){}}
      else{S=null;norm()}}
    S.userName=userName(user);if(!S.rev)S.rev=Date.now();saveLocal();U.auth={mode:'app'};renderApp();
    if(!d||(+S.rev||0)>(+((d.data||{}).rev)||0))await sbPush();else setSync('ok')}
  catch(e){if(!S){renderAuth('login',['err','No pudimos cargar tus datos: '+authErr(e)]);return}setSync(navigator.onLine?'err':'offline',authErr(e))}}
async function boot(){U.auth={mode:'loading'};renderAuth('loading');const cfg=sbCfg();if(!cfg){renderAuth('setup');return}
  const recovery=/type=recovery/.test(location.hash);
  try{const c=await sbClient(cfg);
    c.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY')renderAuth('newpass');else if(ev==='SIGNED_OUT'&&U.auth&&U.auth.mode==='app')leaveApp()});
    const {data}=await c.auth.getSession();const sess=data&&data.session;
    if(sess&&recovery){history.replaceState(null,'',location.pathname+location.search);renderAuth('newpass');return}
    if(sess){if(location.hash.includes('access_token'))history.replaceState(null,'',location.pathname+location.search);await enterApp(sess.user)}else renderAuth('login')}
  catch(e){renderAuth('login',['err',authErr(e)])}}
function leaveApp(){clearTimeout(SB.timer);try{DKEY&&localStorage.removeItem(DKEY)}catch(e){}SB.user=null;DKEY=null;S=null;U.ms=[];U.side=false;U.f='';U.q='';setSync('off');renderModal();renderAuth('login',['ok','Sesión cerrada.'])}
function mSync(){const close=`<button class="btn ghost sm icon" data-a="closeM" title="Cerrar">${ic('x')}</button>`;const u=SB.user||{};
  return `<div class="modal"><div class="mhead"><h3>${ic('cloud')} Tu cuenta</h3>${close}</div>
    <div class="acct"><div class="av">${esc(userName(u).charAt(0).toUpperCase())}</div><div><b>${esc(userName(u))}</b><span>${esc(u.email||'')}</span></div></div>
    <div class="ibox"><div class="irow"><div class="nm">Estado</div><div class="muted">${esc((SYNC_UI[SB.st]||SYNC_UI.off)[1])}${SB.last?' · '+fmtWhen(SB.last):''}</div></div></div>
    <p class="note">Tus datos se guardan solos en la nube y solo tú puedes verlos. Inicia sesión con esta misma cuenta en el celular o en cualquier computadora para ver tu contenido.</p>
    <div class="mfoot"><button class="btn ghost danger" data-a="logout">${ic('x',14)}Cerrar sesión</button><button class="btn pri" data-a="sbNow">${ic('cloud',15)}Sincronizar ahora</button></div></div>`}
document.addEventListener('visibilitychange',()=>{if(!SB.user)return;if(document.visibilityState==='visible')sbPull().catch(()=>{});else if(SB.timer){sbPush().catch(()=>{})}});

/* ---------- actions ---------- */
const A={
  burger(){if(wide()){S.sideHidden=!S.sideHidden;save()}else U.side=!U.side;renderApp()},
  sideClose(){if(wide()){S.sideHidden=true;save()}else U.side=false;renderApp()},
  colGo(el){const i=+el.dataset.i;const b=$('.board');const c=b&&b.querySelectorAll('.col')[i];if(c)b.scrollTo({left:c.offsetLeft-14,behavior:'smooth'})},
  calPick(el){U.calSel=el.dataset.date;renderApp()},
  sbNow(){sbPull().then(()=>renderModal()).catch(e=>{setSync('err',authErr(e));renderModal()})},
  logout(){if(!confirm('¿Cerrar sesión? Tus datos quedan guardados en tu cuenta.'))return;const go=()=>leaveApp();const p=SB.pushing||(SB.timer?sbPush():Promise.resolve());Promise.resolve(p).catch(()=>{}).then(()=>SB.client.auth.signOut()).catch(()=>{}).finally(()=>{if(SB.user)go()})},
  authTab(el){U.auth.mode=el.dataset.m;U.auth.msg=null;U.auth.form=Object.assign(U.auth.form||{},{email:val('auEmail')||(U.auth.form||{}).email});drawAuth()},
  authLogin(){authRun(async pw=>{const email=U.auth.form.email,password=pw.pass;if(!email||!password)throw new Error('Escribe tu email y contraseña.');
    const r=await SB.client.auth.signInWithPassword({email,password});if(r.error)throw r.error;await enterApp(r.data.session.user)})},
  authSignup(){authRun(async pw=>{const {name,email}=U.auth.form,password=pw.pass;if(!name)throw new Error('Escribe tu nombre.');if(!/^\S+@\S+\.\S+$/.test(email||''))throw new Error('Escribe un email válido.');if(password.length<8)throw new Error('La contraseña debe tener al menos 8 caracteres.');
    const r=await SB.client.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.href.split('#')[0]}});if(r.error)throw r.error;
    if(r.data.session)await enterApp(r.data.session.user);else{U.auth.mode='check';U.auth.busy=false;U.auth.msg=['ok','Cuenta creada para '+email+'.'];drawAuth()}})},
  authForgot(){authRun(async()=>{const email=U.auth.form.email;if(!email)throw new Error('Escribe tu email.');const r=await SB.client.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(r.error)throw r.error;
    U.auth.busy=false;U.auth.msg=['ok','Si existe una cuenta con ese email, te llegará un enlace en unos minutos.'];drawAuth()})},
  authNewPass(){authRun(async pw=>{const a=pw.pass,b=pw.pass2;if(a.length<8)throw new Error('La contraseña debe tener al menos 8 caracteres.');if(a!==b)throw new Error('Las contraseñas no coinciden.');
    const r=await SB.client.auth.updateUser({password:a});if(r.error)throw r.error;const {data}=await SB.client.auth.getSession();await enterApp(data.session.user);toast('Contraseña actualizada')})},
  authSetup(){const url=val('stUrl').replace(/\/$/,''),key=val('stKey');U.auth.form={url,key};if(!validCfg({url,key})){U.auth.msg=['err','Revisa la URL (https://xxxx.supabase.co) y la clave publishable.'];return drawAuth()}sbSaveCfg({url,key});boot()},
  sbCopySql(){const done=()=>toast('SQL copiado');try{navigator.clipboard.writeText(SB_SQL).then(done,()=>prompt('Copia este SQL:',SB_SQL))}catch(e){prompt('Copia este SQL:',SB_SQL)}},
  asana(){U.imp=null;U.side=false;renderApp();openM({m:'asana'})},
  pickAsana(){$('#asanaFile').click()},
  impReset(){U.imp=null;renderModal()},
  impGo(){const n=$('#impName');if(n&&U.imp)U.imp.name=n.value;doImport()},
  proj(el){S.cur=el.dataset.id;U.f='';U.q='';if(S.view==='page')S.view='overview';U.side=false;navSave();renderApp()},
  newProj(){const n=prompt('Nombre del nuevo proyecto','Nuevo proyecto');if(!n||!n.trim())return;const p=newProject(n.trim(),false);S.projects.push(p);S.cur=p.id;S.view='overview';U.f='';U.q='';save();renderApp()},
  delProj(){if(S.projects.length<2){alert('Debe quedar al menos un proyecto.');return}if(!confirm('¿Eliminar este proyecto y todo su contenido? No se puede deshacer.'))return;S.projects=S.projects.filter(p=>p.id!==S.cur);S.cur=S.projects[0].id;S.view='overview';save();renderApp()},
  projEmoji(){const e=prompt('Emoji o icono del proyecto',P().emoji);if(e&&e.trim()){P().emoji=e.trim().slice(0,4);save();renderApp()}},
  nav(el){S.view=el.dataset.v;U.side=false;navSave();renderApp()},
  theme(el){S.theme=el.dataset.t||'light';try{localStorage.setItem(KEY+'-theme',S.theme)}catch(e){}save();renderApp()},
  exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='content-studio-'+todayS()+'.json';document.body.appendChild(a);a.click();a.remove()},
  importData(){$('#importFile').click()},
  clearF(){U.f='';U.q='';renderApp()},
  newTask(el){const p=P();const t=blankTask();const d=el.dataset;if(d.date)t.date=d.date;
    if(d.p){if(d.p==='__pillar')t.pillar=d.v||null;else t.props[d.p]=d.v||null}
    if(!d.p&&U.f.startsWith('pil:'))t.pillar=U.f.slice(4);
    p.tasks.push(t);save();renderApp();openM({m:'task',id:t.id});setTimeout(()=>{const n=$('#tTitle');n&&n.focus()},20)},
  openTask(el){openM({m:'task',id:el.dataset.id})},
  closeM(){closeM()},
